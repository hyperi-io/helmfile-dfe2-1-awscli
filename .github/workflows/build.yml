name: Build

# Manual only: this image changes rarely, and only on purpose.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated image tags to push"
        required: true
        default: "v1.2.0,v1.1.6,latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand the tag list
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          list=""
          IFS=',' read -r -a tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            list+="ghcr.io/${GITHUB_REPOSITORY}:${tag// /}"$'\n'
          done
          {
            echo "list<<EOF"
            printf '%s' "${list}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=helmfile with the AWS CLI, for DFE 2.1 deployments
